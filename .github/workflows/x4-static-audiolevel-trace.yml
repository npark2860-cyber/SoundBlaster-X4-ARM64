name: X4 static AudioLevel trace

on:
  workflow_dispatch:
  push:
    branches:
      - exp/windows-arm64-x4-native-controller
    paths:
      - .github/workflows/x4-static-audiolevel-trace.yml

jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify official Creative App 1.23.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://files.creative.com/creative/bin/apps/swureleases/win/creativeapp/release/CreativeAppSetup_1.23.04.00.exe'
          $expected = '979bbb8828a1f745979165e6f7a33f608ae43c8469b259fcba07d6eeb84c2057'
          $setup = Join-Path $env:RUNNER_TEMP 'CreativeAppSetup_1.23.04.00.exe'
          Invoke-WebRequest -Uri $url -OutFile $setup
          $actual = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          "installer_sha256=$actual" | Set-Content installer-hash.txt
          if ($actual -ne $expected) { throw "Creative installer SHA256 mismatch: $actual" }

      - name: Install Creative App silently for static file acquisition
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'CreativeAppSetup_1.23.04.00.exe'
          $p = Start-Process -FilePath $setup -ArgumentList '/SP- /VERYSILENT /NORESTART' -PassThru -Wait
          if ($p.ExitCode -notin @(0, 3010, 1641)) { throw "Creative installer exit code $($p.ExitCode)" }

      - name: Locate and hash Creative control DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force static-input | Out-Null
          $names = @('Creative.Platform.Devices.dll','Creative.Platform.Mixer.dll','CTCDC.dll','CTIntrfu.dll')
          $roots = @(
            ${env:ProgramFiles},
            ${env:ProgramFiles(x86)},
            $env:ProgramData,
            $env:LOCALAPPDATA
          ) | Where-Object { $_ -and (Test-Path $_) }
          $all = @()
          foreach ($name in $names) {
            $matches = foreach ($root in $roots) {
              Get-ChildItem -Path $root -Filter $name -File -Recurse -ErrorAction SilentlyContinue
            }
            $matches = @($matches | Sort-Object FullName -Unique)
            if ($matches.Count -eq 0) { throw "Could not locate $name" }
            foreach ($m in $matches) {
              $h = (Get-FileHash -Algorithm SHA256 $m.FullName).Hash.ToLowerInvariant()
              $all += [pscustomobject]@{ Name=$name; SHA256=$h; Path=$m.FullName }
            }
          }
          $all | Format-Table -AutoSize | Out-String -Width 4096 | Set-Content static-dll-hashes.txt

          $deviceExpected = '2d77172fb6ae850b6d03a09830892c8c3a0ab79e10dda28f40a76b3fadc47e93'
          $devices = $all | Where-Object { $_.Name -eq 'Creative.Platform.Devices.dll' -and $_.SHA256 -eq $deviceExpected } | Select-Object -First 1
          if (-not $devices) { throw 'Exact Creative.Platform.Devices.dll SHA256 from X4_CONTROL_MAP.md was not found.' }
          Copy-Item $devices.Path static-input/Creative.Platform.Devices.dll

          foreach ($name in @('Creative.Platform.Mixer.dll','CTCDC.dll','CTIntrfu.dll')) {
            $first = $all | Where-Object Name -eq $name | Select-Object -First 1
            Copy-Item $first.Path (Join-Path 'static-input' $name)
          }

      - name: Decompile managed Devices and Mixer assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .tools,decompiled/Devices,decompiled/Mixer | Out-Null
          dotnet tool install ilspycmd --tool-path .tools
          & ./.tools/ilspycmd.exe -p -o decompiled/Devices static-input/Creative.Platform.Devices.dll
          & ./.tools/ilspycmd.exe -p -o decompiled/Mixer static-input/Creative.Platform.Mixer.dll

      - name: Extract AudioLevel definitions and call sites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patterns = 'RawCmdAudioLevelGet|RawResAudioLevel|AudioLevelRanges|AudioLevel|IsdBLevel|DevCommOperation|AudioControlIndex'
          $out = New-Object System.Collections.Generic.List[string]
          foreach ($root in @('decompiled/Devices','decompiled/Mixer')) {
            $files = Get-ChildItem $root -Filter *.cs -Recurse
            foreach ($f in $files) {
              $lines = Get-Content $f.FullName
              $hits = Select-String -InputObject $lines -Pattern $patterns -AllMatches
              if (-not $hits) { continue }
              $hitLines = New-Object System.Collections.Generic.HashSet[int]
              for ($i=0; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match $patterns) { [void]$hitLines.Add($i) }
              }
              if ($hitLines.Count -eq 0) { continue }
              $out.Add("===== $($f.FullName) =====")
              foreach ($idx in ($hitLines | Sort-Object)) {
                $start = [Math]::Max(0, $idx - 35)
                $end = [Math]::Min($lines.Count - 1, $idx + 55)
                $out.Add("--- context line $($idx + 1) ---")
                for ($j=$start; $j -le $end; $j++) {
                  $out.Add(('{0,6}: {1}' -f ($j + 1), $lines[$j]))
                }
              }
            }
          }
          $out | Set-Content audiolevel-static-trace.txt
          if (-not (Select-String -Path audiolevel-static-trace.txt -Pattern 'RawCmdAudioLevelGet|AudioLevel' -Quiet)) {
            throw 'No AudioLevel symbols recovered from managed assemblies.'
          }

      - name: Native import/string context for CTCDC and CTIntrfu
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dumpbin = (Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC' -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if ($dumpbin) {
            & $dumpbin /imports static-input/CTCDC.dll | Out-File ctcdc-imports.txt -Width 4096
            & $dumpbin /imports static-input/CTIntrfu.dll | Out-File ctintrfu-imports.txt -Width 4096
          } else {
            'dumpbin not found' | Set-Content ctcdc-imports.txt
            'dumpbin not found' | Set-Content ctintrfu-imports.txt
          }

      - name: Upload text-only static trace
        uses: actions/upload-artifact@v4
        with:
          name: x4-audiolevel-static-trace
          path: |
            installer-hash.txt
            static-dll-hashes.txt
            audiolevel-static-trace.txt
            ctcdc-imports.txt
            ctintrfu-imports.txt
          if-no-files-found: error
          retention-days: 3
