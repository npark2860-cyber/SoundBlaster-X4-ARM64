name: Temp Build B5 Sample Rate Fix

on:
  push:
    branches:
      - exp/windows-arm64-asio-b5-control-panel
    paths:
      - .github/workflows/temp-build-b5-sample-rate-fix.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: exp/windows-arm64-asio-b5-control-panel
          fetch-depth: 0

      - name: Verify source scope and sample-rate fix
        shell: pwsh
        run: |
          $base = "4475fc17b70f372fe317fa201f201e8dc5543f9f"
          git merge-base --is-ancestor $base HEAD
          if ($LASTEXITCODE -ne 0) { throw "Validated B5 base missing" }
          $allowed = @(
            ".github/workflows/temp-build-b5-sample-rate-fix.yml",
            "src/asio-arm64-stage-b0/CMakeLists.txt",
            "src/asio-arm64-stage-b0/control_panel_b5.cpp",
            "src/asio-arm64-stage-b0/control_panel_b5.h",
            "src/asio-arm64-stage-b0/driver_b5.cpp",
            "src/asio-arm64-stage-b5-classic/CMakeLists.txt"
          )
          $changed = @(git diff --name-only $base HEAD)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) { throw "Unexpected source diff: $($unexpected -join ', ')" }
          $driver = Get-Content src/asio-arm64-stage-b0/driver_b5.cpp -Raw
          if ($driver -notmatch "load_persisted_sample_rate") { throw "sample-rate restore helper missing" }
          if ($driver -notmatch "save_persisted_sample_rate") { throw "sample-rate save helper missing" }
          if ($driver -match "initialized_free_ = false;\s*sample_rate_ = 48000\.0;") { throw "48 kHz init reset still present" }

      - name: Configure ARM64EC
        shell: pwsh
        run: cmake -S src/asio-arm64-stage-b0 -B build/ec -G "Visual Studio 17 2022" -A ARM64EC

      - name: Build ARM64EC DLL
        shell: pwsh
        run: cmake --build build/ec --config Release --target x4-asio-arm64ec-b5 --parallel

      - name: Configure Classic ARM64
        shell: pwsh
        run: cmake -S src/asio-arm64-stage-b5-classic -B build/arm64 -G "Visual Studio 17 2022" -A ARM64

      - name: Build Classic ARM64 DLL
        shell: pwsh
        run: cmake --build build/arm64 --config Release --target x4-asio-arm64-b5 --parallel

      - name: Verify architectures and runtime markers
        shell: pwsh
        run: |
          $ec = Join-Path $PWD "build/ec/Release/x4-asio-arm64ec-b5.dll"
          $classic = Join-Path $PWD "build/arm64/Release/x4-asio-arm64-b5.dll"
          foreach ($f in @($ec, $classic)) { if (-not (Test-Path $f)) { throw "Missing DLL: $f" } }
          function Get-Machine([string]$file) {
            $bytes = [System.IO.File]::ReadAllBytes($file)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }
          if ((Get-Machine $ec) -ne 0x8664) { throw "ARM64EC machine mismatch" }
          if ((Get-Machine $classic) -ne 0xAA64) { throw "Classic ARM64 machine mismatch" }
          $markers = @(
            "dual-event-mux-v4-coalesce-recovery",
            "runtime-failsafe-v1",
            "packet-stats-observed-v1",
            "post-coalesce-stale-v1"
          )
          foreach ($f in @($ec, $classic)) {
            $ascii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($f))
            foreach ($marker in $markers) {
              if (-not $ascii.Contains($marker)) { throw "Missing runtime marker $marker in $f" }
            }
          }

      - name: Stage DLLs only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/ec/Release/x4-asio-arm64ec-b5.dll dist/
          Copy-Item build/arm64/Release/x4-asio-arm64-b5.dll dist/

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundBlaster-X4-ASIO-B5-Control-Panel-SampleRate-Fix
          path: dist/*.dll
          if-no-files-found: error
          retention-days: 14
