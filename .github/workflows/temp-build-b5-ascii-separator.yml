name: Temp Build B5 ASCII Separator Fix

on:
  push:
    branches:
      - exp/windows-arm64-asio-b5-control-panel
    paths:
      - .github/workflows/temp-build-b5-ascii-separator.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: exp/windows-arm64-asio-b5-control-panel
          fetch-depth: 0

      - name: Apply ASCII separator fix only
        shell: pwsh
        run: |
          $path = "src/asio-arm64-stage-b0/control_panel_b5.cpp"
          $text = Get-Content $path -Raw -Encoding utf8
          $old = 'L"Driver 2.00  •  %ls"'
          $new = 'L"Driver 2.00  |  %ls"'
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected exactly one separator string, found $count" }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText((Join-Path $PWD $path), $text, [System.Text.UTF8Encoding]::new($false))
          git diff --check
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne $path) { throw "Unexpected source changes: $($changed -join ', ')" }

      - name: Configure ARM64EC
        shell: pwsh
        run: cmake -S src/asio-arm64-stage-b0 -B build/asio-b5-arm64ec-ascii -A ARM64EC

      - name: Build ARM64EC DLL
        shell: pwsh
        run: cmake --build build/asio-b5-arm64ec-ascii --config Release --target x4-asio-arm64ec-b5 --parallel

      - name: Configure Classic ARM64
        shell: pwsh
        run: cmake -S src/asio-arm64-stage-b5-classic -B build/asio-b5-arm64-ascii -A ARM64

      - name: Build Classic ARM64 DLL
        shell: pwsh
        run: cmake --build build/asio-b5-arm64-ascii --config Release --target x4-asio-arm64-b5 --parallel

      - name: Verify runtime markers and ASCII separator
        shell: pwsh
        run: |
          $ec = "build/asio-b5-arm64ec-ascii/Release/x4-asio-arm64ec-b5.dll"
          $classic = "build/asio-b5-arm64-ascii/Release/x4-asio-arm64-b5.dll"
          foreach ($dll in @($ec, $classic)) {
            if (-not (Test-Path $dll)) { throw "Missing DLL: $dll" }
            $bytes = [System.IO.File]::ReadAllBytes($dll)
            $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
            foreach ($marker in @("dual-event-mux-v4-coalesce-recovery", "runtime-failsafe-v1", "packet-stats-observed-v1", "post-coalesce-stale-v1")) {
              if (-not $ascii.Contains($marker)) { throw "Missing runtime marker $marker in $dll" }
            }
          }
          $source = Get-Content "src/asio-arm64-stage-b0/control_panel_b5.cpp" -Raw -Encoding utf8
          if (-not $source.Contains('L"Driver 2.00  |  %ls"')) { throw "ASCII separator source fix missing" }
          if ($source.Contains('L"Driver 2.00  •  %ls"')) { throw "Unicode bullet still present" }

      - name: Stage DLLs only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item "build/asio-b5-arm64ec-ascii/Release/x4-asio-arm64ec-b5.dll" "artifact/x4-asio-arm64ec-b5.dll"
          Copy-Item "build/asio-b5-arm64-ascii/Release/x4-asio-arm64-b5.dll" "artifact/x4-asio-arm64-b5.dll"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundBlaster-X4-ASIO-B5-Control-Panel-ASCII-Fix
          path: artifact/*.dll
          if-no-files-found: error

      - name: Commit source fix and remove temporary workflow
        shell: pwsh
        run: |
          git rm .github/workflows/temp-build-b5-ascii-separator.yml
          git add src/asio-arm64-stage-b0/control_panel_b5.cpp
          git diff --cached --check
          git config user.name "npark2860-cyber"
          git config user.email "npark2860@gmail.com"
          git commit -m "Use ASCII separator in B5 control panel"
          git push origin HEAD:exp/windows-arm64-asio-b5-control-panel
