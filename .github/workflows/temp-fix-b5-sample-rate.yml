name: Temp Fix B5 Sample Rate Persistence

on:
  push:
    branches:
      - exp/windows-arm64-asio-b5-control-panel
    paths:
      - .github/workflows/temp-fix-b5-sample-rate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: exp/windows-arm64-asio-b5-control-panel
          fetch-depth: 0

      - name: Apply minimal sample-rate persistence fix
        shell: pwsh
        run: |
          $path = "src/asio-arm64-stage-b0/driver_b5.cpp"
          $text = (Get-Content $path -Raw).Replace("`r`n", "`n")

          $old = "constexpr ULONG kRenderPinId = 1;`nconstexpr ULONG kCapturePinId = 4;"
          $new = "constexpr ULONG kRenderPinId = 1;`nconstexpr ULONG kCapturePinId = 4;`nconstexpr wchar_t kB5PreferencesKey[] = L`"Software\\SoundBlaster-X4-ARM64\\ASIO B5`";`nconstexpr wchar_t kB5SampleRateValue[] = L`"SampleRate`";"
          if (-not $text.Contains($old)) { throw "constants anchor not found" }
          $text = $text.Replace($old, $new)

          $old = "bool supported_rate(ASIOSampleRate rate) {`n    return rate == 48000.0 || rate == 96000.0 || rate == 192000.0;`n}`n`nbool capture_supported_rate(ASIOSampleRate rate) {"
          $new = "bool supported_rate(ASIOSampleRate rate) {`n    return rate == 48000.0 || rate == 96000.0 || rate == 192000.0;`n}`n`nASIOSampleRate load_persisted_sample_rate() {`n    DWORD value = 0;`n    DWORD size = sizeof(value);`n    const LONG result = RegGetValueW(`n        HKEY_CURRENT_USER,`n        kB5PreferencesKey,`n        kB5SampleRateValue,`n        RRF_RT_REG_DWORD,`n        nullptr,`n        &value,`n        &size);`n    if (result != ERROR_SUCCESS) return 48000.0;`n    const ASIOSampleRate rate = static_cast<ASIOSampleRate>(value);`n    return supported_rate(rate) ? rate : 48000.0;`n}`n`nbool save_persisted_sample_rate(ASIOSampleRate rate) {`n    if (!supported_rate(rate)) return false;`n    HKEY key = nullptr;`n    const LONG open_result = RegCreateKeyExW(`n        HKEY_CURRENT_USER,`n        kB5PreferencesKey,`n        0,`n        nullptr,`n        REG_OPTION_NON_VOLATILE,`n        KEY_SET_VALUE,`n        nullptr,`n        &key,`n        nullptr);`n    if (open_result != ERROR_SUCCESS) return false;`n`n    const DWORD value = static_cast<DWORD>(rate);`n    const LONG set_result = RegSetValueExW(`n        key,`n        kB5SampleRateValue,`n        0,`n        REG_DWORD,`n        reinterpret_cast<const BYTE*>(&value),`n        sizeof(value));`n    RegCloseKey(key);`n    return set_result == ERROR_SUCCESS;`n}`n`nbool capture_supported_rate(ASIOSampleRate rate) {"
          if (-not $text.Contains($old)) { throw "supported_rate anchor not found" }
          $text = $text.Replace($old, $new)

          $old = "        release_host_buffers();`n        initialized_free_ = false;`n        sample_rate_ = 48000.0;`n        InterlockedExchange64(&sample_position_, 0);"
          $new = "        release_host_buffers();`n        initialized_free_ = false;`n        sample_rate_ = load_persisted_sample_rate();`n        InterlockedExchange64(&sample_position_, 0);"
          if (-not $text.Contains($old)) { throw "init sample-rate anchor not found" }
          $text = $text.Replace($old, $new)

          $old = "        sample_rate_ = sampleRate;`n        sprintf_s(last_error_, sizeof(last_error_), `"B5 sample rate selected %.0f Hz`", sample_rate_);`n        return ASE_OK;"
          $new = "        sample_rate_ = sampleRate;`n        const bool persisted = save_persisted_sample_rate(sample_rate_);`n        sprintf_s(last_error_, sizeof(last_error_),`n                  `"B5 sample rate selected %.0f Hz persist=%s`",`n                  sample_rate_, persisted ? `"YES`" : `"NO`");`n        return ASE_OK;"
          if (-not $text.Contains($old)) { throw "setSampleRate anchor not found" }
          $text = $text.Replace($old, $new)

          [System.IO.File]::WriteAllText((Join-Path $PWD $path), $text, [System.Text.UTF8Encoding]::new($false))
          git rm .github/workflows/temp-fix-b5-sample-rate.yml
          git diff --check

          $changed = @(git diff --name-only HEAD)
          if ($changed.Count -ne 2) { throw "Expected driver + temp workflow only, got $($changed -join ', ')" }
          if ($changed -notcontains "src/asio-arm64-stage-b0/driver_b5.cpp") { throw "driver_b5.cpp missing from diff" }
          if ($changed -notcontains ".github/workflows/temp-fix-b5-sample-rate.yml") { throw "temp workflow removal missing from diff" }

      - name: Commit fix and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "npark2860-cyber"
          git config user.email "npark2860@gmail.com"
          git add src/asio-arm64-stage-b0/driver_b5.cpp
          git commit -am "Persist B5 sample rate across ASIO reinitialization"
          git push origin HEAD:exp/windows-arm64-asio-b5-control-panel
