name: Build X4 CTCDC Session Open Probe ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ARM64 CTCDC Session Open Probe
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure ARM64
        shell: pwsh
        run: |
          cmake -S src/serial-poc -B build/serial-poc -G "Visual Studio 17 2022" -A ARM64

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build/serial-poc --config Release --parallel

      - name: Verify ARM64 PE and package
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "build/serial-poc/Release/x4-serial-ctcdc-probe.exe"
          if (-not (Test-Path $exe)) {
            throw "x4-serial-ctcdc-probe.exe was not produced"
          }

          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0xAA64) {
            throw ("Expected ARM64 PE machine 0xAA64, got 0x{0:X4}" -f $machine)
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe dist/x4-serial-ctcdc-probe.exe
          Copy-Item src/serial-poc/README.md dist/README.md
          Compress-Archive -Path dist/x4-serial-ctcdc-probe.exe,dist/README.md -DestinationPath dist/SoundBlaster-X4-CTCDC-Serial-Probe-ARM64.zip -Force

          "ARM64 PE verified: 0xAA64"
          "EXE SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash)"
          "ZIP SHA256: $((Get-FileHash dist/SoundBlaster-X4-CTCDC-Serial-Probe-ARM64.zip -Algorithm SHA256).Hash)"

      - name: Upload probe ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SoundBlaster-X4-CTCDC-Serial-Probe-ARM64
          path: dist/SoundBlaster-X4-CTCDC-Serial-Probe-ARM64.zip
          if-no-files-found: error
          retention-days: 14
