name: Build X4 Read-Only Capability Probe ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ARM64 X4 Read-Only Capability Probe
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure ARM64
        shell: pwsh
        run: |
          cmake -S src/x4-control-readonly-probe -B build/x4-control-readonly-probe -G "Visual Studio 17 2022" -A ARM64

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build/x4-control-readonly-probe --config Release --parallel

      - name: Verify ARM64 PE and package
        shell: pwsh
        run: |
          $cap = Join-Path $PWD "build/x4-control-readonly-probe/Release/x4-control-readonly-probe.exe"
          $challenge = Join-Path $PWD "build/x4-control-readonly-probe/Release/x4-ctcdc-challenge-capture.exe"
          foreach ($exe in @($cap, $challenge)) {
            if (-not (Test-Path $exe)) { throw "Missing executable: $exe" }
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0xAA64) {
              throw ("Expected ARM64 PE machine 0xAA64 for {0}, got 0x{1:X4}" -f $exe, $machine)
            }
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $cap dist/x4-control-readonly-probe.exe
          Copy-Item $challenge dist/x4-ctcdc-challenge-capture.exe
          Copy-Item src/x4-control-readonly-probe/README.md dist/README.md
          Compress-Archive -Path dist/x4-control-readonly-probe.exe,dist/x4-ctcdc-challenge-capture.exe,dist/README.md -DestinationPath dist/SoundBlaster-X4-ReadOnly-Capability-Probe-ARM64.zip -Force

          "ARM64 PE verified: both executables are 0xAA64"
          "Capability EXE SHA256: $((Get-FileHash $cap -Algorithm SHA256).Hash)"
          "Challenge EXE SHA256: $((Get-FileHash $challenge -Algorithm SHA256).Hash)"
          "ZIP SHA256: $((Get-FileHash dist/SoundBlaster-X4-ReadOnly-Capability-Probe-ARM64.zip -Algorithm SHA256).Hash)"

      - name: Upload probe ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SoundBlaster-X4-ReadOnly-Capability-Probe-ARM64
          path: dist/SoundBlaster-X4-ReadOnly-Capability-Probe-ARM64.zip
          if-no-files-found: error
          retention-days: 14
