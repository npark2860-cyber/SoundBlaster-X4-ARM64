name: Build X4 Read-Only Capability Probe ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ARM64 X4 Read-Only Capability Probe
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout capability-probe source
        uses: actions/checkout@v4
        with:
          ref: exp/windows-arm64-x4-readonly-capability-map

      - name: Configure ARM64
        shell: pwsh
        run: |
          cmake -S src/x4-control-readonly-probe -B build/x4-control-readonly-probe -G "Visual Studio 17 2022" -A ARM64

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build/x4-control-readonly-probe --config Release --target x4-control-readonly-probe --parallel

      - name: Verify ARM64 PE and stage
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "build/x4-control-readonly-probe/Release/x4-control-readonly-probe.exe"
          if (-not (Test-Path $exe)) {
            throw "x4-control-readonly-probe.exe was not produced"
          }

          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0xAA64) {
            throw ("Expected ARM64 PE machine 0xAA64, got 0x{0:X4}" -f $machine)
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe dist/x4-control-readonly-probe.exe
          Copy-Item src/x4-control-readonly-probe/RUN-READONLY-CAPABILITY-PROBE.cmd dist/RUN-READONLY-CAPABILITY-PROBE.cmd
          Copy-Item src/x4-control-readonly-probe/README.md dist/README.md

          "ARM64 PE verified: 0xAA64"
          "EXE SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash)"

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundBlaster-X4-ReadOnly-Capability-Probe-ARM64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
