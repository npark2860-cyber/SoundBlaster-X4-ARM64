name: Build X4 APO ARM64 Stage A0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ARM64 X4 pass-through APO
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout native-controller source
        uses: actions/checkout@v4
        with:
          ref: exp/windows-arm64-x4-native-controller

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build APO Release ARM64
        shell: pwsh
        run: |
          msbuild src/x4-apo-arm64/X4ApoArm64.vcxproj /m /restore /p:Configuration=Release /p:Platform=ARM64 /v:minimal

      - name: Build offline COM probe Release ARM64
        shell: pwsh
        run: |
          msbuild src/x4-apo-com-probe-arm64/X4ApoComProbeArm64.vcxproj /m /restore /p:Configuration=Release /p:Platform=ARM64 /v:minimal

      - name: Verify ARM64 PEs and stage
        shell: pwsh
        run: |
          $dll = Join-Path $PWD "src/x4-apo-arm64/bin/ARM64/Release/X4ApoArm64.dll"
          $probe = Join-Path $PWD "src/x4-apo-com-probe-arm64/bin/ARM64/Release/X4ApoComProbeArm64.exe"

          foreach ($file in @($dll, $probe)) {
            if (-not (Test-Path $file)) {
              throw "$file was not produced"
            }

            $bytes = [System.IO.File]::ReadAllBytes($file)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0xAA64) {
              throw ("Expected ARM64 PE machine 0xAA64 for {0}, got 0x{1:X4}" -f $file, $machine)
            }

            "ARM64 PE verified: $file"
            "SHA256: $((Get-FileHash $file -Algorithm SHA256).Hash)"
          }

          New-Item -ItemType Directory -Force -Path dist/x4-apo-arm64-stage-a0 | Out-Null
          Copy-Item $dll dist/x4-apo-arm64-stage-a0/X4ApoArm64.dll
          Copy-Item $probe dist/x4-apo-arm64-stage-a0/X4ApoComProbeArm64.exe
          Copy-Item src/x4-apo-arm64/README.md dist/x4-apo-arm64-stage-a0/README-APO.md
          Copy-Item src/x4-apo-com-probe-arm64/README.md dist/x4-apo-arm64-stage-a0/README-COM-PROBE.md

      - name: Upload Stage A0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundBlaster-X4-APO-ARM64-Stage-A0
          path: dist/x4-apo-arm64-stage-a0/*
          if-no-files-found: error
          retention-days: 14
